name: Build Bun release artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build:
    name: Verify and package Bun application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 同 ci.yml：只能用已正式发布的版本，1.4.0 尚未发布（只有 canary）。
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: bun run verify

      - name: Package application
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          tar \
            --exclude='**/node_modules' \
            --exclude='uploads' \
            --exclude='content' \
            --exclude='.env' \
            -czf "utterlog-${RELEASE_VERSION}.tar.gz" \
            AGENT.md LICENSE README.md INSTALL.md package.json bun.lock bunfig.toml tsconfig.json \
            install.sh Makefile app deploy scripts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: utterlog-${{ github.ref_name }}
          path: utterlog-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
