<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Whono 主题预览：左侧栏导航 + 右侧文章列表">
  <defs>
    <style>
      .bg      { fill: #fffefc; }
      .panel   { fill: #f2f2f0; }
      .line    { stroke: #e7e5e4; }
      .title   { fill: #292524; }
      .muted   { fill: #57534e; }
      .faint   { fill: #a8a29e; }
      .accent  { fill: #b91c1c; }
      .brand   { font-family: Georgia, "Times New Roman", serif; }
      .serif   { font-family: "Noto Serif SC", "Songti SC", STSong, Georgia, serif; }
      .kai     { font-family: "LXGW WenKai Lite", "Kaiti SC", STKaiti, "Noto Serif SC", serif; }
    </style>
    <clipPath id="whono-card">
      <rect x="0" y="0" width="1200" height="760" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#whono-card)">
    <rect class="bg" width="1200" height="760" />

    <!-- ===== 左侧栏（320px） ===== -->
    <g>
      <!-- 站名 -->
      <text class="brand title" x="350" y="96" font-size="30" text-anchor="end" letter-spacing="0.5">Whono</text>

      <!-- 题记（楷体斜体，右对齐两行） -->
      <text class="kai muted" x="350" y="142" font-size="15" text-anchor="end" font-style="italic">写一点，记一点，</text>
      <text class="kai muted" x="350" y="166" font-size="15" text-anchor="end" font-style="italic">把日子摊开看看。</text>

      <!-- 导航（右对齐 + 小圆点） -->
      <g class="serif" font-size="16">
        <text class="title" x="336" y="234" text-anchor="end">首页</text>
        <circle class="title" cx="350" cy="229" r="2.5" opacity="0.55" />

        <text class="title" x="336" y="274" text-anchor="end">归档</text>
        <circle class="title" cx="350" cy="269" r="2.5" opacity="0.55" />

        <text class="title" x="336" y="314" text-anchor="end">分类</text>
        <circle class="title" cx="350" cy="309" r="2.5" opacity="0.55" />

        <text class="title" x="336" y="354" text-anchor="end">标签</text>
        <circle class="title" cx="350" cy="349" r="2.5" opacity="0.55" />

        <text class="title" x="336" y="394" text-anchor="end">关于</text>
        <circle class="title" cx="350" cy="389" r="2.5" opacity="0.55" />
      </g>

      <!-- 底部动作按钮：搜索 / RSS / 主题 -->
      <g fill="none" stroke="#57534e" stroke-width="1.5" stroke-linecap="round">
        <circle cx="292" cy="684" r="7" />
        <path d="M297 689l5 5" />
        <path d="M336 692a9 9 0 0 0-9-9" />
        <path d="M336 680a21 21 0 0 0-21-21" />
        <circle cx="316" cy="691" r="1.8" fill="#57534e" stroke="none" />
        <path d="M374 672a8 8 0 1 0 0.5 12" />
      </g>
    </g>

    <!-- 竖向分隔线 -->
    <line class="line" x1="371" y1="50" x2="371" y2="710" stroke-width="1" />

    <!-- ===== 右侧正文区 ===== -->
    <g>
      <!-- 引言 -->
      <text class="kai muted" x="419" y="102" font-size="16">一个写字的地方，偶尔也放点照片和碎碎念。</text>

      <!-- 区块标题 + 短横线 -->
      <text class="serif title" x="419" y="168" font-size="21" font-weight="600">文章</text>
      <rect class="line" x="419" y="184" width="32" height="1" />
      <text class="kai faint" x="1102" y="168" font-size="13" text-anchor="end">第 1 / 6 页</text>

      <!-- 列表行 1（悬停态，带底色） -->
      <rect class="panel" x="405" y="206" width="697" height="104" rx="14" />
      <text class="serif title" x="419" y="238" font-size="18" font-weight="600">把博客从 Typecho 搬到 Astro 的那几天</text>
      <text class="kai faint" x="1102" y="238" font-size="12" text-anchor="end">2026/09/18</text>
      <text class="kai muted" x="419" y="266" font-size="15">折腾了三个晚上，导出、清洗、改模板，中间踩了一堆坑……</text>
      <text class="kai accent" x="419" y="294" font-size="13">#Astro</text>
      <text class="kai accent" x="487" y="294" font-size="13">#折腾记</text>

      <!-- 列表行 2 -->
      <text class="serif title" x="419" y="352" font-size="18" font-weight="600">周末带孩子去了趟蒙山</text>
      <text class="kai faint" x="1102" y="352" font-size="12" text-anchor="end">2026/09/12</text>
      <text class="kai muted" x="419" y="380" font-size="15">天气不错，老二一路跑在前面，回来腿都抬不动了。</text>
      <line class="line" x1="419" y1="404" x2="1102" y2="404" stroke-width="1" />

      <!-- 列表行 3 -->
      <text class="serif title" x="419" y="448" font-size="18" font-weight="600">明信片收到了，从东北寄来的</text>
      <text class="kai faint" x="1102" y="448" font-size="12" text-anchor="end">2026/09/05</text>
      <text class="kai muted" x="419" y="476" font-size="15">邮戳有点糊，但字写得真好看。下一批准备回寄。</text>
      <line class="line" x1="419" y1="500" x2="1102" y2="500" stroke-width="1" />

      <!-- 列表行 4 -->
      <text class="serif title" x="419" y="544" font-size="18" font-weight="600">换了个新主题，双栏的那种</text>
      <text class="kai faint" x="1102" y="544" font-size="12" text-anchor="end">2026/08/29</text>
      <text class="kai muted" x="419" y="572" font-size="15">左边导航右边正文，看着清爽，就是窄屏下要重排。</text>
      <line class="line" x1="419" y1="596" x2="1102" y2="596" stroke-width="1" />

      <!-- 分页 -->
      <g>
        <rect x="419" y="630" width="92" height="36" rx="12" fill="none" class="line" stroke-width="1" />
        <text class="kai muted" x="465" y="653" font-size="13" text-anchor="middle">‹ 上一页</text>
        <text class="kai faint" x="547" y="653" font-size="13">1 / 6</text>
        <rect x="1010" y="630" width="92" height="36" rx="12" fill="none" class="line" stroke-width="1" />
        <text class="kai muted" x="1056" y="653" font-size="13" text-anchor="middle">下一页 ›</text>
      </g>

      <!-- 页脚 -->
      <text class="kai faint" x="753" y="710" font-size="11" text-anchor="middle">© Whono · 共 62 篇 · 128,431 次浏览</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="759" rx="14" fill="none" stroke="#e7e5e4" />
</svg>
