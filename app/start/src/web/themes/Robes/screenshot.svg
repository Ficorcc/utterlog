<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Robes 主题预览">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7d7d7"/>
      <stop offset="0.5" stop-color="#c8c9cd"/>
      <stop offset="1" stop-color="#d3d1d4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#839ac9"/>
      <stop offset="1" stop-color="#6f86b5"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fa8d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fa8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a7d6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9a7d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a1a1a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#pageBg)"/>
  <circle cx="180" cy="140" r="170" fill="url(#orb1)" filter="url(#soft)"/>
  <circle cx="1030" cy="620" r="190" fill="url(#orb2)" filter="url(#soft)"/>

  <g filter="url(#card)">
    <rect x="110" y="60" width="980" height="630" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55"/>
  </g>

