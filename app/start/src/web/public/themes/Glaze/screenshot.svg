<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Glaze 主题预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f4" />
      <stop offset="1" stop-color="#eef2ef" />
    </linearGradient>
    <linearGradient id="ripple" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48e76a" stop-opacity="0.25" />
      <stop offset="1" stop-color="#48e76a" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <circle cx="540" cy="120" r="150" fill="url(#ripple)" />

  <!-- 顶栏 -->
